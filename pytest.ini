[pytest]
# The project is a set of top-level packages (services, stage0, stages, database),
# so the root has to be importable however pytest is invoked — `pytest` and
# `python -m pytest` differ on that.
pythonpath = .
testpaths = tests

# Strict, not auto: an async test missing its marker should fail loudly rather
# than be silently skipped. A failover test that never runs is worse than none.
asyncio_mode = strict
asyncio_default_fixture_loop_scope = function

filterwarnings =
    error::RuntimeWarning
